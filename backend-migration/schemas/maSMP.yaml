# masmp_schema_linkml.yaml
id: https://example.org/masmp
name: maSMP
description: Metadata Schema for Scientific Software

prefixes:
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  codemeta: https://codemeta.github.io/terms/
  maSMP: https://discovery.biothings.io/ns/maSMP/

default_prefix: maSMP
default_range: string

imports:
  - linkml:types

classes:

  SoftwareSourceCode:
    description: A software source code entity
    slots:
      # Required Properties
      - codeRepository
      - programmingLanguage
      - version
      - description
      - name
      - url
      # Recommended Properties
      - versionControlSystem
      - hasSourceCode
      - archivedAt
      - author
      - citation
      - identifier
      - keywords
      - license
      - readme
      - intendedUse
      # Optional Properties
      - codeSampleType
      - runtimePlatform
      - conditionOfAccess
      - contributor
      - copyrightHolder
      - dateModified
      - datePublished
      - discussionUrl
      - isAccessibleForFree
      - maintainer
      - buildInstructions
      - issueTracker
      - referencePublication
      - developerDocumentation
      - learningResource
      - changeLog
      - testedWith
      - userDocumentation
      - deployInstructions
      - installInstructions
      - testInstructions
      - testObject

  SoftwareApplication:
    description: A deployed software application
    slots:
      - name
      - description
      - url
      - author
      - citation
      - license
      - identifier
      - keywords
      - releaseNotes
      - readme
      - archivedAt
      - intendedUse
      - softwareVersion

slots:

  # --- Required for SoftwareSourceCode ---
  name:
    required: true
    categories:
      - required
    range: string
    slot_uri: schema:name

  description:
    required: true
    categories:
      - required
    range: string
    slot_uri: schema:description

  url:
    required: true
    categories:
      - required
    range: uri
    slot_uri: schema:url

  codeRepository:
    required: true
    categories:
      - required
    range: uri
    slot_uri: schema:codeRepository

  version:
    required: true
    categories:
      - required
    range: string
    slot_uri: schema:version

  programmingLanguage:
    required: true
    categories:
      - required
    range: string
    multivalued: true
    slot_uri: schema:programmingLanguage

  # --- Recommended ---
  author:
    categories:
      - recommended
    range: string
    multivalued: true
    slot_uri: schema:author

  citation:
    categories:
      - recommended
    range: string
    slot_uri: schtestInputema:citation

  license:
    categories:
      - recommended
    range: uri
    slot_uri: schema:license

  identifier:
    categories:
      - recommended
    range: string
    slot_uri: schema:identifier

  keywords:
    categories:
      - recommended
    range: string
    multivalued: true
    slot_uri: schema:keywords

  readme:
    categories:
      - recommended
    range: uri
    slot_uri: codemeta:readme

  versionControlSystem:
    categories:
      - recommended
    range: string
    slot_uri: maSMP:versionControlSystem

  intendedUse:
    categories:
      - recommended
    range: string
    slot_uri: maSMP:intendedUse

  archivedAt:
    categories:
      - recommended
    range: uri
    slot_uri: schema:archivedAt

  releaseNotes:
    categories:
      - recommended
    range: string
    slot_uri: schema:releaseNotes

  softwareVersion:
    categories:
      - recommended
    range: string
    slot_uri: schema:softwareVersion
