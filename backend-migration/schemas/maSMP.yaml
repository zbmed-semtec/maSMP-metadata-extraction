# masmp_schema_linkml.yaml
id: https://example.org/masmp
name: maSMP
description: Metadata Schema for Scientific Software

prefixes:
  linkml: https://w3id.org/linkml/
  codemeta: https://codemeta.github.io/terms/
  maSMP: https://discovery.biothings.io/ns/maSMP/
  schema: https://schema.org/

default_prefix: maSMP
default_range: string

classes:

  SoftwareSourceCode:
    description: A software source code entity
    slots:
      # Required Properties
      - codeRepository
      - programmingLanguage
      - version
      - description
      - name
      - url
      # Recommended Properties
      - versionControlSystem
      - hasSourceCode
      - archivedAt
      - author
      - citation
      - identifier
      - keywords
      - license
      - readme
      - intendedUse
      # Optional Properties
      - codeSampleType
      - runtimePlatform
      - conditionOfAccess
      - contributor
      - copyrightHolder
      - dateModified
      - datePublished
      - discussionUrl
      - isAccessibleForFree
      - maintainer
      - buildInstructions
      - issueTracker
      - referencePublication
      - developerDocumentation
      - learningResource
      - changeLog
      - testedWith
      - userDocumentation
      - deployInstructions
      - installInstructions
      - testInstructions

  SoftwareApplication:
    description: A deployed software application
    slots:
      - name
      - description
      - url
      - author
      - citation
      - license
      - identifier
      - keywords
      - releaseNotes
      - readme
      - archivedAt
      - intendedUse
      - softwareVersion

slots:

  # --- Required for SoftwareSourceCode ---
  name:
    required: true
    categories:
      - Required
    range: string
    slot_uri: schema:name

  description:
    required: true
    categories:
      - Required
    range: string
    slot_uri: schema:description

  url:
    required: true
    categories:
      - Required
    range: uri
    slot_uri: schema:url

  codeRepository:
    required: true
    categories:
      - Required
    range: uri
    slot_uri: schema:codeRepository

  version:
    required: true
    categories:
      - Required
    range: string
    slot_uri: schema:version

  programmingLanguage:
    required: true
    categories:
      - Required
    range: string
    multivalued: true
    slot_uri: schema:programmingLanguage

  # --- Recommended ---
  author:
    categories:
      - Recommended
    range: string
    multivalued: true
    slot_uri: schema:author

  citation:
    categories:
      - Recommended
    range: string
    slot_uri: schema:citation

  license:
    categories:
      - Recommended
    range: uri
    slot_uri: schema:license

  identifier:
    categories:
      - Recommended
    range: string
    slot_uri: schema:identifier

  keywords:
    categories:
      - Recommended
    range: string
    multivalued: true
    slot_uri: schema:keywords

  readme:
    categories:
      - Recommended
    range: uri
    slot_uri: codemeta:readme

  versionControlSystem:
    categories:
      - Recommended
    range: string
    slot_uri: maSMP:versionControlSystem

  intendedUse:
    categories:
      - Recommended
    range: string
    slot_uri: maSMP:intendedUse

  archivedAt:
    categories:
      - Recommended
    range: uri
    slot_uri: schema:archivedAt

  releaseNotes:
    categories:
      - Recommended
    range: string
    slot_uri: schema:releaseNotes

  softwareVersion:
    categories:
      - Recommended
    range: string
    slot_uri: schema:softwareVersion

  hasSourceCode:
    categories:
      - Required
    required: true
    slot_uri: codemeta:hasSourceCode

  contributor:
    categories:
      - Recommended
    required: false
    slot_uri: schema:contributor

  copyrightHolder:
    categories:
      - Optional
    required: false
    slot_uri: schema:copyrightHolder

  dateCreated:
    categories:
      - Recommended
    required: false
    slot_uri: schema:dateCreated

  dateModified:
    categories:
      - Recommended
    required: false
    slot_uri: schema:dateModified

  datePublished:
    categories:
      - Recommended
    required: false
    slot_uri: schema:datePublished

  isAccessibleForFree:
    categories:
      - Optional
    required: false
    slot_uri: schema:isAccessibleForFree

  issueTracker:
    categories:
      - Optional
    required: false
    slot_uri: schema:issueTracker

  # --- Optional Properties (NEWLY ADDED) ---
  codeSampleType:
    description: The type of code sample (e.g., example, snippet, template)
    categories:
      - Optional
    required: false
    range: string
    slot_uri: maSMP:codeSampleType

  runtimePlatform:
    description: The runtime platform(s) required to run the software (e.g., Python 3.8+, Java 11)
    categories:
      - Optional
    required: false
    range: string
    multivalued: true
    slot_uri: schema:runtimePlatform

  conditionOfAccess:
    description: The conditions under which the software is accessible (e.g., login required, open access)
    categories:
      - Optional
    required: false
    range: string
    slot_uri: schema:conditionOfAccess

  discussionUrl:
    description: URL to a forum or discussion thread for the software
    categories:
      - Optional
    required: false
    range: uri
    slot_uri: schema:discussionUrl

  maintainer:
    description: The person or organization that maintains the software
    categories:
      - Optional
    required: false
    range: string
    multivalued: true
    slot_uri: schema:maintainer

  buildInstructions:
    description: URL to build or compilation instructions
    categories:
      - Optional
    required: false
    range: uri
    slot_uri: maSMP:buildInstructions

  referencePublication:
    description: Reference to a publication associated with this software
    categories:
      - Optional
    required: false
    range: uri
    multivalued: true
    slot_uri: maSMP:referencePublication

  developerDocumentation:
    description: URL to developer or API documentation
    categories:
      - Optional
    required: false
    range: uri
    multivalued: true
    slot_uri: maSMP:developerDocumentation

  learningResource:
    description: URL to learning resources, tutorials, or training materials
    categories:
      - Optional
    required: false
    range: uri
    multivalued: true
    slot_uri: maSMP:learningResource

  changeLog:
    description: URL to the software change log or release history
    categories:
      - Optional
    required: false
    range: uri
    slot_uri: maSMP:changeLog

  testedWith:
    description: List of software versions or environments the software has been tested with
    categories:
      - Optional
    required: false
    range: string
    multivalued: true
    slot_uri: maSMP:testedWith

  userDocumentation:
    description: URL to end-user documentation
    categories:
      - Optional
    required: false
    range: uri
    multivalued: true
    slot_uri: maSMP:userDocumentation

  deployInstructions:
    description: URL to deployment instructions
    categories:
      - Optional
    required: false
    range: uri
    slot_uri: maSMP:deployInstructions

  installInstructions:
    description: URL to installation instructions
    categories:
      - Optional
    required: false
    range: uri
    slot_uri: maSMP:installInstructions

  testInstructions:
    description: URL to testing instructions
    categories:
      - Optional
    required: false
    range: uri
    slot_uri: maSMP:testInstructions

  softwareRequirement:
    description: URL to testing instructions
    categories:
      - Optional
    required: false
    range: uri
    slot_uri: maSMP:softwareRequirements